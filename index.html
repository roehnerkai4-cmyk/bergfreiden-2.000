<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuskript Upload</title>
    <meta
      name="description"
      content="Öffentliche Upload- und Vorschau-Seite für fertige Web-Manuskripte."
    />
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">M</div>
          <div class="brand-copy">
            <span class="brand-name">Manuskript Upload</span>
            <span class="brand-subtitle">Cloudflare Public</span>
          </div>
        </div>
        <div class="status-pill">Öffentlich</div>
      </header>

      <main class="workspace">
        <section class="panel upload-panel">
          <div id="dropzone" class="dropzone" aria-label="Datei hochladen">
            <input id="fileInput" type="file" hidden accept=".html,.htm,.zip,.txt,.md,.pdf" />
            <div class="dropzone-content">
              <div class="upload-icon">⬆️</div>
              <h1>Manuskript hier ablegen</h1>
              <p>oder</p>
              <button type="button" class="primary-btn" id="browseBtn">Datei auswählen</button>
            </div>
          </div>

          <div class="meta-list">
            <div class="meta-item">
              <span>Datei</span>
              <strong id="fileName">Keine Datei ausgewählt</strong>
            </div>
            <div class="meta-item">
              <span>Größe</span>
              <strong id="fileSize">—</strong>
            </div>
            <div class="meta-item">
              <span>Typ</span>
              <strong id="fileType">—</strong>
            </div>
          </div>
        </section>

        <section class="panel preview-panel">
          <div class="preview-head">
            <h2>Vorschau</h2>
            <button id="openInNewTab" class="secondary-btn" type="button">In neuem Tab öffnen</button>
          </div>

          <div class="preview-frame-wrap">
            <div id="emptyState" class="empty-state">
              Noch keine Datei hochgeladen.<br />
              Lade dein fertiges Manuskript hoch, um es hier anzusehen.
            </div>
            <iframe id="previewFrame" title="Manuskriptvorschau" style="display:none;"></iframe>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
